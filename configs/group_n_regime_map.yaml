group_id: group_n_regime_map
title: Main-theorem regime map
description: Map the best Stein-trimmed regime over contamination, separation, and calibration size.
figure_kind: heatmap_regime
theory_refs:
  - thm:robust-coverage-ksd-trimmed
  - prop:delta-bias-covariance
  - lem:delta-bias-tv
defaults:
  alpha: 0.1
  train_size: 900
  clean_reference_size: 160
  threshold_policy: fixed_grid
  mc_reps: 100
  random_seed: 2026041801
  dgp_family: tradeoff
  contamination_family: partial_separation
  predictor_type: linear
  clean_test_size: 1600
  mixture_test_size: 1600
  structure_sample_size: 1200
  threshold_quantiles: [0.70, 0.80, 0.90, 0.95]
  methods: [stein_trimmed, ordinary_split_conformal, clean_oracle_trim, random_trim]
  include_mixture_eval: true
  dirty_scale: 0.8
