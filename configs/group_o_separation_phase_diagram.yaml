group_id: group_o_separation_phase_diagram
title: Separation phase diagram
description: Trace the transition from no separation to near-ideal separation on a continuous path.
figure_kind: phase_diagram
theory_refs:
  - thm:ideal-separation-fixed
  - thm:no-separation-fixed
defaults:
  alpha: 0.1
  train_size: 900
  clean_reference_size: 160
  threshold_policy: clean_reference_only
  mc_reps: 100
  random_seed: 2026041802
  dgp_family: ideal_separation
  contamination_family: partial_separation
  predictor_type: linear
  clean_test_size: 1600
  mixture_test_size: 1600
  structure_sample_size: 1200
  threshold_quantiles: [0.95]
  methods: [stein_trimmed, ordinary_split_conformal, clean_oracle_trim, residual_trim]
  reference_quantile: 0.95
  dirty_scale: 0.8
