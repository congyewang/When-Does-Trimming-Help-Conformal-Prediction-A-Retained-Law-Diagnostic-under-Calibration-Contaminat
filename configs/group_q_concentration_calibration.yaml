group_id: group_q_concentration_calibration
title: Concentration calibration study
description: Estimate retained-set concentration violation rates across calibration sizes and contamination modes.
figure_kind: concentration_calibration
theory_refs:
  - lem:fixed-threshold
defaults:
  alpha: 0.1
  train_size: 900
  clean_reference_size: 160
  threshold_policy: fixed_grid
  mc_reps: 100
  random_seed: 2026041902
  dgp_family: tradeoff
  contamination_family: separated_covariate
  predictor_type: linear
  clean_test_size: 1000
  mixture_test_size: 1000
  structure_sample_size: 1200
  threshold_quantiles: [0.70, 0.85, 0.95]
  methods: [stein_trimmed]
