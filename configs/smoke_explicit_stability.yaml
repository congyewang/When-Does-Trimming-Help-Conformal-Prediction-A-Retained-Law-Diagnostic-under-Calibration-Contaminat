group_id: smoke_explicit_stability
title: Smoke explicit stability
description: Tiny explicit-stability run for smoke testing.
figure_kind: explicit_stability
theory_refs:
  - cor:ksd-explicit-clean-coverage
  - cor:ksd-explicit-clean-coverage-fully-explicit
defaults:
  alpha: 0.1
  epsilon: 0.2
  train_size: 220
  calibration_size: 80
  threshold_policy: fixed_grid
  mc_reps: 3
  random_seed: 2026042004
  dgp_family: gaussian_homoscedastic
  contamination_family: partial_separation
  predictor_type: linear
  clean_test_size: 200
  mixture_test_size: 200
  structure_sample_size: 240
  threshold_quantiles: [0.70, 0.95]
  methods: [stein_trimmed]
  compute_population_metrics: true
  dirty_loc: 4.0
  dirty_scale: 0.8
  score_model_mode: well_specified
  notes: Population Stein scores and bridge envelopes are numerically approximated; explicit failure diagnostics are retained in outputs.
experiments:
  - config_id: smoke_explicit_r048_bw080
    clean_reference_size: 48
    population_sample_size: 400
    evaluation_grid_size: 48
    bandwidth_scale: 0.8
  - config_id: smoke_explicit_r048_bw160
    clean_reference_size: 48
    population_sample_size: 400
    evaluation_grid_size: 48
    bandwidth_scale: 1.6
  - config_id: smoke_explicit_r128_bw080
    clean_reference_size: 128
    population_sample_size: 900
    evaluation_grid_size: 96
    bandwidth_scale: 0.8
  - config_id: smoke_explicit_r128_bw160
    clean_reference_size: 128
    population_sample_size: 900
    evaluation_grid_size: 96
    bandwidth_scale: 1.6
